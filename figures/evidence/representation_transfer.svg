<text x="24" y="100" font-size="14">ESM-2</text>
<rect x="310" y="84" width="381.820" height="23"/>
<text x="701.820" y="101" font-size="14">0.022460</text>
<text x="24" y="142" font-size="14">ESM-2 + random width control</text>
<rect x="310" y="126" width="371.704" height="23"/>
<text x="691.704" y="143" font-size="14">0.021865</text>
