name: AbCite eval gate
on:
  push:
    paths: ["abcite/**"]
  pull_request:
    paths: ["abcite/**"]
jobs:
  eval:
    name: fast tests (tiny CLIP-like, no HF download)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abcite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python evals/build_corpus.py
      - run: pytest
      - run: python evals/run.py

  clip:
    name: optional HF CLIP (cached)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: abcite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-b-32-${{ runner.os }}
      - run: pip install -e ".[dev,clip]"
      - run: python evals/build_corpus.py
      - name: Real CLIP figure retrieval if weights available
        env:
          ABCITE_CLIP: "1"
          HF_HUB_OFFLINE: ${{ github.event_name == 'schedule' && '0' || '0' }}
        run: |
          python - <<'PY'
          import os, sys
          os.environ["ABCITE_CLIP"] = "1"
          from pathlib import Path
          try:
              from abcite_core.tiny_clip import load_hf_clip
              enc = load_hf_clip()
          except Exception as exc:
              print("HF CLIP unavailable (expected without cache):", exc)
              sys.exit(0)
          from abcite_core.retrieval import HybridIndex
          from ingest.chunking import load_corpus
          root = Path(".")
          idx = HybridIndex(load_corpus(root / "corpus"), vision=enc)
          # CLIP expects raster images; SVG may fail — fall back is not an error here.
          try:
              hits = idx.search_by_image(root / "corpus" / "figures" / "fig-1n8z.svg", top_k=3)
              print("CLIP hits", [h.chunk.chunk_id for h in hits])
          except Exception as exc:
              print("CLIP encode skipped on SVG:", exc)
          print("HF CLIP encoder loaded:", enc.name)
          PY
