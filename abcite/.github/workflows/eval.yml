name: AbCite eval gate
on:
  push:
    paths: ["abcite/**"]
  pull_request:
    paths: ["abcite/**"]
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abcite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python evals/build_corpus.py
      - run: pytest
      - run: python evals/run.py
